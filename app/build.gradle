plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// release signing — credentials live in keystore.properties (NOT in git)
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.clicksolutions.wifiscout'
    compileSdk 35

    defaultConfig {
        applicationId "com.clicksolutions.wifiscout"
        minSdk 26
        targetSdk 35
        // Version is defined once in gradle.properties (APP_VERSION_NAME / APP_VERSION_CODE)
        versionCode APP_VERSION_CODE.toInteger()
        versionName APP_VERSION_NAME
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // Firebase — trial counting + licensing (Firestore, anonymous auth)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'

    // Google Play Billing — in-app license purchase
    // Google requires 8.0.0+ from 31 Aug 2026 (extension until 1 Nov 2026)
    implementation 'com.android.billingclient:billing:9.1.0'
}