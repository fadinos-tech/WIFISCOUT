org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# ── App version — single source of truth ──────────────────────────
# Change the version ONLY here. build.gradle and the app UI
# (BuildConfig.VERSION_NAME) pull it from these two lines.
APP_VERSION_NAME=1.1.4
APP_VERSION_CODE=12

# AGP 8.2 officially supports up to compileSdk 34; 35 works fine — silence the warning
android.suppressUnsupportedCompileSdk=35
